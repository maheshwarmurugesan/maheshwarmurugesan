name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%236b4a2b&color_dots=%23e8e0d0,%239ccfa8,%235fb574,%233dd66f,%232a7a3f
            dist/snake-dark.svg?color_snake=%237a5530&color_dots=%231a1510,%231f3d23,%232a7a3f,%233dd66f,%237cf2a0
            dist/snake.gif?color_snake=%237a5530&color_dots=%231a1510,%231f3d23,%232a7a3f,%233dd66f,%237cf2a0

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
